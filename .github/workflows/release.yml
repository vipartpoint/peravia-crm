name: Release Pipeline

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend - Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Backend - Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Backend - TypeScript Build
        working-directory: ./backend
        run: npm run build

      - name: Backend - Unit Tests
        working-directory: ./backend
        run: npm run test --if-present

      - name: Backend - Security Scan
        working-directory: ./backend
        run: npm audit --audit-level=high

      - name: Frontend - Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend - TypeScript Build
        working-directory: ./frontend
        run: npm run build

      - name: Frontend - Unit Tests
        working-directory: ./frontend
        run: npm run test --if-present

      - name: Frontend - Security Scan
        working-directory: ./frontend
        run: npm audit --audit-level=high

  publish-backend:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/peravia/backend
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Build (Local for Scan)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          load: true
          tags: backend:scan

      - name: Docker Image Verification (Security Scan)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'backend:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-frontend:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/peravia/frontend
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Build (Local for Scan)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          load: true
          tags: frontend:scan

      - name: Docker Image Verification (Security Scan)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'frontend:scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  generate-deployment-artifacts:
    needs: [publish-backend, publish-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Validate Deployment Package Contents
        run: |
          echo "Validating client-deploy package contents..."
          # Define forbidden patterns
          FORBIDDEN=("src/" ".git/" ".env" "*.sql" "*.md" "test/" "demo/")
          # Exceptions
          ALLOWED_MDS=("README.md")
          
          # Check for forbidden files
          for item in "${FORBIDDEN[@]}"; do
             if find client-deploy/ -name "$item" ! -name "README.md" | grep -q .; then
                echo "CRITICAL: Forbidden item '$item' found in deployment package!"
                exit 1
             fi
          done
          echo "Validation Passed."

      - name: Package Deployment Folder
        run: zip -r peravia-crm-deploy.zip client-deploy/
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: peravia-crm-deploy.zip

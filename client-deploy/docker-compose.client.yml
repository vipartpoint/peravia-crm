version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: crm_db_client
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-crm_db}
    volumes:
      - crm_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crm_redis_client
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword}
    volumes:
      - crm_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: crm_minio_client
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - crm_minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    image: ghcr.io/${GITHUB_OWNER}/peravia/backend:${APP_VERSION:-v1.0.0}
    container_name: crm_backend_client
    restart: always
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.client
    ports:
      - "3000:3000"

  frontend:
    image: ghcr.io/${GITHUB_OWNER}/peravia/frontend:${APP_VERSION:-v1.0.0}

    container_name: crm_frontend_client
    restart: always
    depends_on:
      - backend
    env_file:
      - .env.client
    ports:
      - "3002:3002"

volumes:
  crm_db_data:
  crm_redis_data:
  crm_minio_data:
